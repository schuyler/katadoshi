<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient from deep red to black -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background square -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGradient)"/>
  
  <!-- 形 (kata) character using Noto Sans CJK JP Black -->
  <!-- y=512 centers vertically using dominant-baseline -->
  <text x="512" y="512" font-family="Noto Sans CJK JP" font-weight="900" font-size="580" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" filter="url(#dropShadow)">形</text>

</svg>